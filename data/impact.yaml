# Static impact table for the five-path assessment (feature 003 FR-007).
#
# Every entry is a low/high range with a unit, a status, and its sources. Status:
#   sourced     - derived from the cited sources; `derivation` shows how.
#   assumption  - a modelling assumption informed by the cited sources.
#   placeholder - not yet backed by a source; fails the coverage check (npm test -w server).
# The calculator (T-004) cites entry IDs in `impact_refs`. Validate with `npm test -w server`.
#
# Scope: a typical 14-inch Windows laptop (the demo models are not chosen yet). Part prices are
# Austrian/German retail in EUR incl. VAT on the access date; RAM and SSD prices are inflated by
# the 2025-2026 memory shortage (see sources.memory_price_crisis) and should be rechecked before
# the demo. Values from the team's component research (v6 spreadsheet) were cross-checked;
# where research disagreed, the entry says so in `notes`.

