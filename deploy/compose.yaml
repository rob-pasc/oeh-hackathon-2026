# Example production setup: both images on one host, behind an external Caddy that terminates
# HTTPS and routes /api/* to the server and everything else to the web app.
# Both ports are published on all host interfaces, as the production host needs. The host firewall
# must keep them unreachable from outside, so nothing is reachable except through Caddy.
# Usage and the Caddy routes: docs/DEPLOYMENT.md.
#
#   cp .env.example .env               # image tag, ports, server secrets
#   docker compose up -d

name: leaaf

services:
  web:
    image: ${LEAAF_REGISTRY:-ghcr.io/rob-pasc}/leaaf-web:${LEAAF_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"

  server:
    image: ${LEAAF_REGISTRY:-ghcr.io/rob-pasc}/leaaf-server:${LEAAF_TAG:-latest}
    restart: unless-stopped
    # The same .env Compose reads for the tag and ports; the server ignores those extra variables.
    env_file:
      - path: .env
        required: false
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - server-data:/data

volumes:
  # SQLite database and caches. Survives container restarts and image updates; back it up
  # before deleting it (docs/DEPLOYMENT.md).
  server-data:
