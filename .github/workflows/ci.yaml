name: CI

# Checks every pull request and push to main. Pushing a Git tag additionally publishes the
# web and server images to GHCR (see docs/DEPLOYMENT.md).
on:
  pull_request:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Type check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scanner:
    name: Scanner vet and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: scanner/go.mod
          cache-dependency-path: scanner/go.sum
      # The Linux build is the Gio window (feature 007), which needs cgo and these headers.
      - name: Install the Gio build libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc pkg-config
          libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev
          libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev
      - run: go vet ./...
      - run: go vet -tags console ./...
      # Each system's collector only compiles for that system, so vet those builds too. The
      # macOS window needs the macOS SDK; its console build is vetted here, the window in
      # scanner-macos.
      - run: go vet ./...
        env:
          GOOS: windows
      - run: go vet -tags console ./...
        env:
          GOOS: darwin
      # schema_test.go reads ../shared/schemas, which the checkout provides.
      - run: go test ./...

  scanner-macos:
    name: Scanner on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: scanner/go.mod
          cache-dependency-path: scanner/go.sum
      - run: go vet ./...
        working-directory: scanner
      - run: go test ./...
        working-directory: scanner
      # Same version scheme as the images: the Git tag on releases, sha-<short sha> otherwise.
      - name: Build the app
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; else version=sha-$(git rev-parse --short=7 HEAD); fi
          scanner/packaging/macos/build.sh https://leaaf.green "$version" scanner/macos-release
      - uses: actions/upload-artifact@v4
        with:
          name: scanner-macos
          path: scanner/macos-release/leaaf-scanner-macos.zip
          if-no-files-found: error

  images:
    name: Image (${{ matrix.image }})
    needs: [checks, scanner, scanner-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, server]
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v5
      # server/Dockerfile copies the macOS app from here (it cannot be built in Docker).
      - uses: actions/download-artifact@v4
        if: matrix.image == 'server'
        with:
          name: scanner-macos
          path: scanner/macos-release
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the name, as GHCR requires.
          images: ghcr.io/${{ github.repository_owner }}/leaaf-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ env.PUBLISH }}

      - name: Build${{ env.PUBLISH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          # Each Dockerfile ignores the argument it does not declare. The scanner version is the
          # Git tag on releases and sha-<short sha> otherwise.
          build-args: |
            VITE_API_MODE=live
            SCANNER_VERSION=${{ steps.meta.outputs.version }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
