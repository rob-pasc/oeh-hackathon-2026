# Serves the built single-page app. HTTPS, compression for clients, and routing of /api to the
# server are the job of the external Caddy in front (see docs/DEPLOYMENT.md).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Container health check; not part of the app.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts content-hashed files here, so they never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/s/:id, /d/:id, ...) all load index.html; it must not be cached so a
    # new release is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
